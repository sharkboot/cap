[project]
name = "cap"
version = "0.1.0"
description = "能力集成框架：通过勾选能力项 + agent 桥梁生成 Dockerfile，运行 agent 容器对话并交换文件"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "docker>=7.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
cap = "cap.main:run"
